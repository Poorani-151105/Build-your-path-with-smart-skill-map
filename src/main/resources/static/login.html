<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Skill Map</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0a0a0a; color: white;">
    <div class="glass-card animate-fade" style="width: 100%; max-width: 450px; padding: 3rem; border-radius: 30px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); box-shadow: 0 50px 100px rgba(0,0,0,0.6);">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -2px;">Welcome Back</h1>
            <p style="color: var(--text-secondary);">Sign in to your career dashboard</p>
        </div>
        
        <div id="errorBox" style="display: none; background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 1rem; border-radius: 12px; font-size: 0.9rem; margin-bottom: 1.5rem; border: 1px solid rgba(239, 68, 68, 0.2);"></div>
        
        <form id="loginForm" style="display: flex; flex-direction: column; gap: 1.2rem;">
            <input type="text" id="username" placeholder="Username" required 
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 12px; color: white; width: 100%; outline: none; transition: 0.3s;"
                onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
            
            <input type="password" id="password" placeholder="Password" required 
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.2rem; border-radius: 12px; color: white; width: 100%; outline: none; transition: 0.3s;"
                onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
            
            <button type="submit" class="btn btn-primary" style="padding: 1.2rem; border-radius: 12px; font-size: 1rem; margin-top: 1rem;">Launch Dashboard</button>
        </form>
        
        <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.9rem;">
            New to the path? <a href="signup.html" style="color: var(--accent-color); text-decoration: none; font-weight: 700;">Join Now</a>
        </p>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Check for signup success query param
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('signup') === 'success') {
            const errorBox = document.getElementById('errorBox');
            errorBox.style.background = "rgba(34, 211, 238, 0.1)";
            errorBox.style.color = "var(--accent-color)";
            errorBox.style.borderColor = "rgba(34, 211, 238, 0.2)";
            errorBox.innerText = 'Account created successfully! Please login.';
            errorBox.style.display = 'block';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();
                const errorBox = document.getElementById('errorBox');

                if (response.ok) {
                    localStorage.setItem('user', JSON.stringify(data));
                    window.location.href = 'dashboard.html';
                } else {
                    errorBox.style.background = "rgba(239, 68, 68, 0.1)";
                    errorBox.style.color = "#ef4444";
                    errorBox.style.borderColor = "rgba(239, 68, 68, 0.2)";
                    errorBox.innerText = typeof data === 'string' ? data : (data.message || 'Login failed');
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                const errorBox = document.getElementById('errorBox');
                errorBox.innerText = 'Server connection failed. Ensure backend is running.';
                errorBox.style.display = 'block';
            }
        });
    </script>

</body>
</html>
