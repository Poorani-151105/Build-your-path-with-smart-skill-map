<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Roadmap | Smart Skill Map</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav>
        <div class="logo">Smart Skill Map</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="assessment.html">Assessments</a></li>
            <li><a href="roadmap.html" style="color: var(--accent-color);">Roadmap</a></li>
        </ul>
    </nav>

    <main style="padding: 40px 5%; width: 100%; max-width: 1200px; margin: 0 auto;">
        <div style="margin-bottom: 3rem; text-align: center;">
            <h1 style="font-size: 3rem; margin-bottom: 1rem;">Career <span style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Vector Mapping</span></h1>
            <p style="color: var(--text-secondary); max-width: 700px; margin: 0 auto;">Our recommendation engine has analyzed your holistic skill profile across multiple dimensions.</p>
        </div>

        <!-- Domain Filters -->
        <div style="display: flex; gap: 0.8rem; justify-content: center; margin-bottom: 3rem; flex-wrap: wrap;">
            <button class="btn btn-primary" onclick="filterDomain('ALL')">All Domains</button>
            <button class="btn btn-outline" onclick="filterDomain('ENGINEERING')">Engineering</button>
            <button class="btn btn-outline" onclick="filterDomain('MEDICAL')">Medical</button>
            <button class="btn btn-outline" onclick="filterDomain('LAW')">Law</button>
            <button class="btn btn-outline" onclick="filterDomain('BUSINESS')">Business</button>
            <button class="btn btn-outline" onclick="filterDomain('CHARTERED')">Chartered</button>
            <button class="btn btn-outline" onclick="filterDomain('CREATIVE')">Creative</button>
            <button class="btn btn-outline" onclick="filterDomain('IT')">IT Skills</button>
            <button class="btn btn-outline" onclick="filterDomain('SOFT_SKILLS')">Soft Skills</button>
            <button class="btn btn-outline" onclick="filterDomain('ARTS')">Arts</button>
        </div>

        <div id="recommendationsContainer" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 2rem;">
            <!-- Recommendations will be loaded here -->
            <div class="glass-card animate-fade" style="text-align: center; padding: 4rem; grid-column: 1 / -1;">
                <p style="color: var(--text-secondary);">Analyzing holistic data... Ensure you have taken multiple assessment categories.</p>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        let allRecommendations = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch(`/api/profile/${user.id}/recommendations`, {
                    headers: { 'Authorization': `Bearer ${user.token}` }
                });
                allRecommendations = await response.json();
                renderRoadmaps(allRecommendations);
            } catch (err) {
                console.error("Roadmap error:", err);
            }
        });

        function filterDomain(domain) {
            // Update button styles
            const btns = document.querySelectorAll('main .btn');
            btns.forEach(b => {
                b.classList.remove('btn-primary');
                b.classList.add('btn-outline');
            });
            event.target.classList.remove('btn-outline');
            event.target.classList.add('btn-primary');

            if (domain === 'ALL') {
                renderRoadmaps(allRecommendations);
            } else {
                // STRICT domain_category match from the database field
                const filtered = allRecommendations.filter(r => r.career.domainCategory === domain);
                renderRoadmaps(filtered);
            }
        }

        function renderRoadmaps(recs) {
            const container = document.getElementById('recommendationsContainer');
            container.innerHTML = '';

            if (recs.length === 0) {
                container.innerHTML = `<div class="glass-card" style="grid-column: 1/-1;"><h3>No specific matches found for this filter.</h3><p>Try taking more assessments in other categories.</p></div>`;
                return;
            }

            recs.forEach(item => {
                const career = item.career;
                const match = item.matchPercentage;
                
                let roadmapArray = [];
                try {
                    roadmapArray = career.dailyTrackJson ? JSON.parse(career.dailyTrackJson) : [];
                } catch(e) {
                    console.error("Parse error for track:", career.title);
                }
                
                let stepsHtml = '';
                // Limit to 3 phases to keep the UI clean
                roadmapArray.slice(0, 3).forEach((step, idx) => {
                    const taskName = typeof step === 'string' ? step : (step.task || 'Specialization');
                    stepsHtml += `
                        <div style="position: relative; padding-left: 2rem; border-left: 2px dashed rgba(255,255,255,0.1); margin-bottom: 2rem;">
                            <div style="position: absolute; left: -11px; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--accent-color); border: 4px solid var(--bg-dark);"></div>
                            <h4 style="font-size: 1rem; margin-bottom: 0.5rem; color: #fff;">${taskName}</h4>
                            <p style="color: var(--text-secondary); font-size: 0.85rem;">Phase ${idx + 1} focus.</p>
                        </div>
                    `;
                });

                const card = `
                    <div class="glass-card animate-fade" style="display: flex; flex-direction: column; height: 100%;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 1.5rem;">
                            <span style="background: rgba(34, 211, 238, 0.1); color: var(--accent-color); padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 800;">CAREER TARGET</span>
                            <span style="color: var(--text-secondary); font-size: 1.5rem; font-weight: 800;">${match}%</span>
                        </div>
                        
                        <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">${career.title}</h2>
                        <p style="color: var(--text-secondary); font-size: 0.95rem; margin-bottom: 2rem; flex: 1;">${career.description}</p>
                        
                        <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--glass-border);">
                            <h3 style="font-size: 0.9rem; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 1.5rem; text-transform: uppercase;">Growth Pathway</h3>
                            ${stepsHtml}
                        </div>

                        <button onclick="enroll(${career.id})" class="btn btn-primary" style="margin-top: 1rem; width: 100%;">Enroll in Pathway</button>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        async function enroll(courseId) {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user) return;

            try {
                const response = await fetch(`/api/profile/${user.id}/enroll/${courseId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${user.token}` }
                });
                const result = await response.json();

                
                if (result.status === 'success') {
                    window.location.href = 'daily-plan.html';
                }
            } catch (err) {
                console.error("Enrollment error:", err);
            }
        }
    </script>
</body>
</html>
