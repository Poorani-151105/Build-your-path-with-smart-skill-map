<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Smart Skill Map</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #0a0a0a; color: white;">
    <div class="glass-card animate-fade" style="width: 100%; max-width: 500px; padding: 3rem; border-radius: 30px; border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); box-shadow: 0 50px 100px rgba(0,0,0,0.6);">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; letter-spacing: -2px;">Create Account</h1>
            <p style="color: var(--text-secondary);">Begin your AI-guided career journey</p>
        </div>
        
        <div id="errorBox" style="display: none; background: rgba(239, 68, 68, 0.1); color: #ef4444; padding: 1rem; border-radius: 12px; font-size: 0.9rem; margin-bottom: 1.5rem; border: 1px solid rgba(239, 68, 68, 0.2);"></div>
        
        <form id="signupForm" style="display: flex; flex-direction: column; gap: 1rem;">
            <input type="text" id="username" placeholder="Full Name" required 
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.1rem; border-radius: 12px; color: white; width: 100%; outline: none; transition: 0.3s;"
                onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
            
            <input type="email" id="email" placeholder="Email Address" required 
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.1rem; border-radius: 12px; color: white; width: 100%; outline: none; transition: 0.3s;"
                onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
            
            <input type="password" id="password" placeholder="Create Password" required 
                style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 1.1rem; border-radius: 12px; color: white; width: 100%; outline: none; transition: 0.3s;"
                onfocus="this.style.borderColor='var(--accent-color)'" onblur="this.style.borderColor='rgba(255,255,255,0.1)'">
            
            <button type="submit" class="btn btn-primary" style="padding: 1.2rem; border-radius: 12px; font-size: 1rem; margin-top: 1rem;">Initialize Profile</button>
        </form>
        
        <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.9rem;">
            Already have a path? <a href="login.html" style="color: var(--accent-color); text-decoration: none; font-weight: 700;">Login Here</a>
        </p>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;
            const errorBox = document.getElementById('errorBox');

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email })
                });

                const data = await response.json();

                if (response.ok) {
                    errorBox.style.background = "rgba(34, 211, 238, 0.1)";
                    errorBox.style.color = "var(--accent-color)";
                    errorBox.style.borderColor = "rgba(34, 211, 238, 0.2)";
                    errorBox.innerText = data.message || 'Signup successful! Redirecting to login...';
                    errorBox.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html?signup=success';
                    }, 3000);
                } else {
                    errorBox.innerText = typeof data === 'string' ? data : (data.message || 'Signup failed');
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                errorBox.innerText = 'Server connection failed. Ensure backend is running.';
                errorBox.style.display = 'block';
            }
        });

    </script>
</body>
</html>
