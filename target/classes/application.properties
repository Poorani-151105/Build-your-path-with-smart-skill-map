# Spring Boot Configuration
spring.application.name=smart-skill-map

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smartskillmap?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root25
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Security Configuration
# (Using default settings for now, will implement JWT filters later)
server.port=8081

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
